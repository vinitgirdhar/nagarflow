name: Application checks
on:
  pull_request:
  push:
    branches: [main, verison-updation]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nagarflow-next/package-lock.json
      - run: python -m venv venv
      - run: venv/bin/python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: nagarflow-next
      - run: venv/bin/python -m unittest discover -s backend/tests -t .
      - run: venv/bin/python -m scripts.evaluation.evaluate_intelligence
      - run: npm run test:deployment
        working-directory: nagarflow-next
      - run: npm run test:auth
        working-directory: nagarflow-next
      - run: npm run build
        working-directory: nagarflow-next
      - run: npx playwright install --with-deps chromium
        working-directory: nagarflow-next
      - run: npm run test:e2e
        working-directory: nagarflow-next
      - name: Build backend deployment image
        run: docker build -f Dockerfile.backend -t nagarflow-backend:ci .
      - name: Smoke-test packaged backend startup
        shell: bash
        run: |
          trap 'docker logs nagarflow-backend-ci; docker rm -f nagarflow-backend-ci' EXIT
          docker run -d --name nagarflow-backend-ci -p 127.0.0.1:10000:10000 \
            -e NAGARFLOW_TRUSTED_ORIGINS=https://nagarflow.example.test \
            -e NAGARFLOW_DEMO_ENABLED=true \
            -e NAGARFLOW_MFA_ENABLED=false \
            -e NAGARFLOW_REQUIRE_ADMIN_MFA=false \
            nagarflow-backend:ci
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:10000/api/health
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-failures
          path: nagarflow-next/test-results
          retention-days: 7
