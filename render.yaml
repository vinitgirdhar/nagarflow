# Free backend and colocated worker. Local data resets on sleep/restart/redeploy.
# Netlify serves the native Next.js frontend; see RENDER.md for limitations.
services:
  - type: web
    name: nagarflow
    runtime: docker
    repo: https://github.com/vinitgirdhar/nagarflow
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NAGARFLOW_ENV
        value: production
      - key: NAGARFLOW_STORAGE_DIR
        value: /tmp/nagarflow
      - key: NAGARFLOW_TRUSTED_ORIGINS
        value: https://nagarflow.netlify.app
      - key: NAGARFLOW_INITIAL_ADMIN_EMAIL
        sync: false
      - key: NAGARFLOW_INITIAL_ADMIN_PASSWORD_HASH
        sync: false
      - key: NAGARFLOW_REQUIRE_ADMIN_MFA
        value: "true"
      - key: NAGARFLOW_WEBHOOK_SECRET
        generateValue: true
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
