[build]
  base = "nagarflow-next"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Explicitly load the runtime: this existing site otherwise uploads .next as
# static files without server functions or route rewrites. Keep adapter updates
# automatic by leaving its version unpinned in package.json.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set the real backend HTTPS origin as NAGARFLOW_BACKEND_URL before building.
# Do not add SPA redirects or publish a static export: sessions need the proxy.
